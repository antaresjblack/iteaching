[project]
name = "ai-teaching-supervision-backend"
version = "0.1.0"
description = "AI Teaching Supervision System backend foundation"
readme = "README.md"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
